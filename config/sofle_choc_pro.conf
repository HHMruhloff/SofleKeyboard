# ==============================================================================
# Keebart Sofle Choc Pro BT - ZMK Configuration (config/sofle.conf)
# ==============================================================================

# ------------------------------------------------------------------------------
# Mouse & Studio Controls
# ------------------------------------------------------------------------------
# Enable mouse emulation
CONFIG_ZMK_MOUSE=y

# ZMK Studio Support
CONFIG_ZMK_STUDIO=y

# ------------------------------------------------------------------------------
# Power Management & Display
# ------------------------------------------------------------------------------
# Idle Settings: Display/LEDs gehen nach 30 Minuten aus (1800000 ms)
CONFIG_ZMK_IDLE_TIMEOUT=1800000

# Deep Sleep komplett deaktivieren
CONFIG_ZMK_SLEEP=n

# Stromverwaltung für Peripherie (Displays / Sharp MiP)
CONFIG_ZMK_EXT_POWER=y

# ------------------------------------------------------------------------------
# Bluetooth & Experimental BLE Settings (Fixes Input Lag & Stuttering)
# ------------------------------------------------------------------------------
# Aktiviert experimentelle Bluetooth-Funktionen in ZMK
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Erzwingt eine stabile 1M-PHY-Verbindung (behebt Haken und Aussetzer)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Maxikmale Sendeleistung (+8 dBm) für nRF52840 (stärkeres Signal zum Host & Split-Hälfte)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
